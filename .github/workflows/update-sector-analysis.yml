name: Cap nhat phan tich nhom nganh

on:
  schedule:
    - cron: "15 1 * * *"   # 8:15 sang gio VN
    - cron: "45 8 * * *"   # 15:45 chieu gio VN (sau khi thi truong dong cua)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cai dependency (PyJWT - server.py import o module level)
        run: pip install -r requirements.txt

      - name: Chay script cap nhat
        run: python3 scripts/update_sector_analysis.py

      - name: Commit va push neu co thay doi
        run: |
          git config user.name "stockpeek-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet sector_analysis.json; then
            echo "Khong co thay doi, bo qua commit."
          else
            git add sector_analysis.json
            git commit -m "Cập nhật phân tích nhóm ngành (tự động, không AI)"
            git push
          fi
