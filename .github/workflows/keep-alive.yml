name: Giu server thuc (keep-alive)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping stockPeek de tranh Render tu ngu
        run: |
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" https://stockpeek.onrender.com/ || echo "Ping that bai, se thu lai lan sau"

